<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈커밍 목격신고</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #FFA500; /* 연주황색 */
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            height: auto;
            max-height: 300px;
            margin: 10px 0;
        }

        .info-text {
            color: gray;
            font-style: italic;
            margin-top: 20px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #FFFACD;
            color: black;
            padding: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #FFE4B5;
        }

        @media (max-width: 600px) {
            img {
                max-width: 90%;
            }

            input[type="text"], textarea {
                padding: 12px;
            }

            button[type="submit"] {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

<h1>Homecoming</h1>
<h1>반려동물 실종신고</h1>
<h2>반려동물 정보</h2>

<div class="container">
    <p><strong>사진:</strong></p>
    <img th:src="@{${petinfo.imageUrl}}" alt="펫 사진" />
    <p><strong>이름:</strong> <span th:text="${petinfo.name}">이름</span></p>
    <p><strong>품종:</strong> <span th:text="${petinfo.species}">품종</span></p>
    <p><strong>털 색:</strong> <span th:text="${petinfo.hairColor}">털 색</span></p>
    <p><strong>좋아하는 것/싫어하는 것:</strong> <span th:text="${petinfo.likeDislike}">좋아하는 것/싫어하는 것</span></p>
    <p><strong>지역:</strong> <span th:text="${petinfo.location}">지역</span></p>
    <p><strong>연락처:</strong> <span th:text="${petinfo.phoneNumber}">연락처</span></p>
    <p><strong>메뉴얼:</strong> <span th:text="${petinfo.manual}">메뉴얼</span></p>
</div>

<h2>주인에게 신고해주세요!</h2>
<form action="/report" method="post">
    <input type="hidden" name="petInfoId" th:value="${petinfo.id}" />
    <div>
        <label for="reporterName">신고자 이름:</label>
        <input type="text" id="reporterName" name="reporterName" />
    </div>
    <div>
        <label for="phoneNumber">연락처:</label>
        <input type="text" id="phoneNumber" name="phoneNumber" />
    </div>
    <div>
        <label for="details">상세 내용:</label>
        <textarea id="details" name="details" required></textarea>
    </div>
    <div class="info-text">
        이름과 연락처 기재는 필수가 아닙니다!<br>
        추가적으로 반려동물 주인과 연락을 하고 싶으시다면 기재해주세요!
    </div>
    <button type="submit">신고 제출</button>
</form>

</body>
</html>
